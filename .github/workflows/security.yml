name: Security

# يفحص الأسرار المسرّبة والثغرات في الاعتماديات.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan working tree for secrets
        run: gitleaks detect --no-git --redact --verbose --exit-code 1

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      # البوابة الحاسمة: اعتماديات الإنتاج فقط.
      # التبعيات التطويرية (jest, eslint, @nestjs/cli, webpack) لا تُشحن إلى الإنتاج،
      # ولا يجوز أن تمنع دمج PR أو أن تدفعنا إلى ترقيات Major غير ضرورية.
      - name: Audit production dependencies (blocking)
        run: npm audit --omit=dev --audit-level=high

      # تقرير فقط: يبقى مرئيًا في السجل دون أن يُفشل الفحص.
      - name: Audit all dependencies including dev (report only)
        run: npm audit --audit-level=high || true

# Cloud Build — بناء ونشر تلقائي لخادم NOVA على Cloud Run.
#
# التشغيل يدويًا:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=europe-west1,_SERVICE=nova-backend,_AR_REPO=nova
#
# أو اربطه بمستودع Git عبر Cloud Build Trigger ليعمل عند كل push.

substitutions:
  _REGION: "europe-west1"
  _SERVICE: "nova-backend"
  _AR_REPO: "nova"
  _CLOUD_SQL_INSTANCE: "" # projectId:region:instanceName (اربط Cloud SQL)
  _VPC_CONNECTOR: "" # لـ Memorystore Redis (الشبكة الخاصة)

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"

steps:
  # 1) بناء صورة Docker
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest"
      - "."

  # 2) دفع الصورة إلى Artifact Registry
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}"

  # 3) تشغيل الهجرات (Prisma migrate deploy) كمهمة لمرة واحدة
  - id: migrate
    name: "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"
    entrypoint: sh
    args:
      - "-c"
      - "npx prisma migrate deploy"
    env:
      - "DATABASE_URL=$$DATABASE_URL"
    secretEnv: ["DATABASE_URL"]

  # 4) النشر على Cloud Run
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE}"
      - "--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=4000"
      - "--min-instances=1"
      - "--max-instances=10"
      - "--cpu=1"
      - "--memory=512Mi"
      - "--timeout=3600"
      - "--set-env-vars=NODE_ENV=production,USE_SECRET_MANAGER=true,GCP_PROJECT_ID=$PROJECT_ID"
      # Cloud SQL (أزل التعليق بعد ضبط _CLOUD_SQL_INSTANCE):
      # - "--add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}"
      # Memorystore Redis (أزل التعليق بعد ضبط _VPC_CONNECTOR):
      # - "--vpc-connector=${_VPC_CONNECTOR}"

availableSecrets:
  secretManager:
    - versionName: "projects/$PROJECT_ID/secrets/database-url/versions/latest"
      env: "DATABASE_URL"
